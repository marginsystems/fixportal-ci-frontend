name: Release

# Publish @fix-portal/ci-frontend to public npm on a version tag (e.g. v0.1.0).
#
# The package scope (@fix-portal) is distinct from @fixportal/design's scope, so
# consumers map just this scope to public npm and install it tokenlessly — no
# GitHub Packages mirror needed.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Package (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Configure registry
        run: npm config set @fix-portal:registry https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Publish to public npm
        run: npm publish --provenance -w @fix-portal/ci-frontend
